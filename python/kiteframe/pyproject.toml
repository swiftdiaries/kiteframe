[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kiteframe"
version = "0.1.0"
description = "Immutable Python projections for the Kiteframe Rust core"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28,<1",
]

[tool.uv]
dev-dependencies = [
    "maturin>=1.0,<2.0",
    "pyright>=1.1.411,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14,<1",
]

[tool.maturin]
manifest-path = "../../crates/kiteframe-py/Cargo.toml"
module-name = "kiteframe._native"
python-source = "src"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
exclude = ["src/kiteframe/_native.pyi"]
ignore = ["UP042"]
select = ["E", "F", "UP", "B", "SIM", "I"]
