[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kiteframe-deepagents"
version = "0.1.0"
description = "Kiteframe adapter for the pinned Deep Agents public API"
requires-python = ">=3.11,<4"
dependencies = [
    "deepagents==0.6.12",
    "kiteframe",
]

[tool.uv.sources]
kiteframe = { path = "../kiteframe", editable = true }

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.411,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/kiteframe_deepagents"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pyright]
pythonVersion = "3.11"
