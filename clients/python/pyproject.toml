[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "kiteframe"
version = "0.1.0"
description = "Typed ACP client and bundled harness for Kiteframe"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "websockets>=16,<17"]

[dependency-groups]
dev = [
  "maturin>=1.9,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
  "pyright>=1.1,<2",
]

[tool.maturin]
manifest-path = "../../Cargo.toml"
bindings = "bin"
python-source = "src"
exclude = ["src/kiteframe/__pycache__", "src/kiteframe/**/*.pyc"]
features = ["acp-v2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100
