name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wave-1:
    name: Wave 1 gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Check generated schemas
        run: cargo run -p kiteframe-schema -- --check schemas/v1alpha1

      - name: Check portable dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          dependencies="$(cargo tree \
            -p kiteframe-contract \
            -p kiteframe-core \
            --edges normal \
            --prefix none)"
          forbidden='^(deepagents|langchain|langgraph|openfga|opentelemetry|opentelemetry_sdk|tracing-opentelemetry)( |$)'
          if grep -E "${forbidden}" <<<"${dependencies}"; then
            echo "portable crate depends on a runtime, authorization, or telemetry SDK" >&2
            exit 1
          fi

  fuzz:
    name: Strict YAML fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run strict YAML fuzz target
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run strict_yaml -- -max_total_time=10

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-yaml-fuzz-artifacts
          path: fuzz/artifacts/strict_yaml
          if-no-files-found: ignore
