name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kiteframe_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiteframe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kiteframe_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --all-targets --all-features -- --test-threads=1

      - name: Install uv for live Python client smoke
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Exercise Python client against the compiled harness
        run: |
          cargo build --bin kiteframe-harness
          uv run --project clients/python pytest -q clients/python/tests
        env:
          KITEFRAME_INTEGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
          KITEFRAME_HARNESS_PATH: ${{ github.workspace }}/target/debug/kiteframe-harness

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Test Python client
        run: uv run --project clients/python pytest -q clients/python/tests

      - name: Lint Python client
        run: uv run ruff check src tests scripts
        working-directory: clients/python

      - name: Type-check Python client
        run: uv run --project clients/python pyright

  python-wheels:
    name: Python wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux glibc arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Linux glibc x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build platform wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          working-directory: clients/python

      - name: Inspect, install, import, and launch wheel
        shell: bash
        run: python scripts/inspect_wheel.py "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
        working-directory: clients/python

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
        working-directory: clients/typescript

  typescript-platform-packages:
    name: TypeScript platform package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            package: darwin-arm64
            binary: kiteframe-harness
          - name: macOS x86_64
            runner: macos-15-intel
            package: darwin-x64
            binary: kiteframe-harness
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            package: linux-arm64
            binary: kiteframe-harness
          - name: Linux x86_64
            runner: ubuntu-24.04
            package: linux-x64
            binary: kiteframe-harness
          - name: Windows x86_64
            runner: windows-latest
            package: win32-x64
            binary: kiteframe-harness.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build harness and stage platform package
        shell: bash
        run: |
          cargo build --release --bin kiteframe-harness
          bun install --frozen-lockfile
          bun run package-platform -- "${{ matrix.package }}" "../../target/release/${{ matrix.binary }}"
          (cd "npm/${{ matrix.package }}" && bun pm pack)
          tar -tzf "npm/${{ matrix.package }}"/*.tgz | grep -F "package/${{ matrix.binary }}"
          KITEFRAME_BUN_SMOKE_DIR="$(mktemp -d)"
          bun init -y --cwd "$KITEFRAME_BUN_SMOKE_DIR"
          bun add --cwd "$KITEFRAME_BUN_SMOKE_DIR" "$(pwd)/npm/${{ matrix.package }}"/*.tgz
          "$KITEFRAME_BUN_SMOKE_DIR/node_modules/.bin/kiteframe-harness" --version
        working-directory: clients/typescript

      - name: Upload packed platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: kiteframe-${{ matrix.package }}
          path: clients/typescript/npm/${{ matrix.package }}/*.tgz

      - name: Test, type-check, and build TypeScript client
        run: |
          bun test
          bun run typecheck
          bun run build
        working-directory: clients/typescript
