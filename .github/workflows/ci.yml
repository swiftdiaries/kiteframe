name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kiteframe_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiteframe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kiteframe_ci
      KITEFRAME_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --all-targets --all-features -- --test-threads=1

      - name: Verify isolated database helper
        run: python3 tests/ci/test_isolated_database.py

      - name: Install uv for live Python client smoke
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Create isolated Python live-smoke database
        id: python-live-smoke-database
        shell: bash
        env:
          KITEFRAME_SMOKE_DATABASE_NAME: kiteframe_ci_python_live_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python3 tests/ci/isolated_database.py create \
            --database-url "$DATABASE_URL" \
            --database-name "$KITEFRAME_SMOKE_DATABASE_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Exercise Python client against the compiled harness
        run: |
          cargo build --bin kiteframe-harness
          uv run --project clients/python pytest -q clients/python/tests
        env:
          KITEFRAME_INTEGRATION_DATABASE_URL: ${{ steps.python-live-smoke-database.outputs.database_url }}
          KITEFRAME_HARNESS_PATH: ${{ github.workspace }}/target/debug/kiteframe-harness

      - name: Drop isolated Python live-smoke database
        if: ${{ always() }}
        shell: bash
        env:
          KITEFRAME_SMOKE_DATABASE_NAME: kiteframe_ci_python_live_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python3 tests/ci/isolated_database.py drop \
            --database-url "$DATABASE_URL" \
            --database-name "$KITEFRAME_SMOKE_DATABASE_NAME"

      - name: Install Bun for live TypeScript client smoke
        uses: oven-sh/setup-bun@v2

      - name: Create isolated TypeScript local live-smoke database
        id: typescript-local-smoke-database
        shell: bash
        env:
          KITEFRAME_SMOKE_DATABASE_NAME: kiteframe_ci_typescript_local_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python3 tests/ci/isolated_database.py create \
            --database-url "$DATABASE_URL" \
            --database-name "$KITEFRAME_SMOKE_DATABASE_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Exercise TypeScript client against the compiled harness
        run: |
          (cd clients/typescript && bun install --frozen-lockfile)
          (cd clients/typescript && bun test)
        env:
          KITEFRAME_INTEGRATION_DATABASE_URL: ${{ steps.typescript-local-smoke-database.outputs.database_url }}
          KITEFRAME_HARNESS_PATH: ${{ github.workspace }}/target/debug/kiteframe-harness

      - name: Drop isolated TypeScript local live-smoke database
        if: ${{ always() }}
        shell: bash
        env:
          KITEFRAME_SMOKE_DATABASE_NAME: kiteframe_ci_typescript_local_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python3 tests/ci/isolated_database.py drop \
            --database-url "$DATABASE_URL" \
            --database-name "$KITEFRAME_SMOKE_DATABASE_NAME"

      - name: Create isolated TypeScript remote live-smoke database
        id: typescript-remote-smoke-database
        shell: bash
        env:
          KITEFRAME_SMOKE_DATABASE_NAME: kiteframe_ci_typescript_remote_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python3 tests/ci/isolated_database.py create \
            --database-url "$DATABASE_URL" \
            --database-name "$KITEFRAME_SMOKE_DATABASE_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Exercise TypeScript client against the remote harness
        shell: bash
        run: |
          responses_pid=""
          harness_pid=""
          cleanup() {
            for pid in "$harness_pid" "$responses_pid"; do
              if [ -n "$pid" ]; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT
          python3 tests/fixtures/responses_ready.py &
          responses_pid=$!
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:38474/ready >/dev/null; then break; fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:38474/ready >/dev/null
          KITEFRAME_BIND=127.0.0.1:38473 \
          KITEFRAME_TLS_TERMINATED=true \
          KITEFRAME_BEARER_BINDINGS='[{"secret":"remote-integration-token","principal":"typescript-remote"}]' \
          KITEFRAME_RESPONSES_BASE_URL=http://127.0.0.1:38474/v1 \
          KITEFRAME_RESPONSES_API_KEY=integration-test \
          KITEFRAME_RESPONSES_MODEL=test-model \
          ./target/debug/kiteframe-harness &
          harness_pid=$!
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:38473/readyz >/dev/null; then break; fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:38473/readyz >/dev/null
          (cd clients/typescript && bun test)
        env:
          KITEFRAME_DATABASE_URL: ${{ steps.typescript-remote-smoke-database.outputs.database_url }}
          KITEFRAME_REMOTE_INTEGRATION_URL: ws://127.0.0.1:38473/acp
          KITEFRAME_REMOTE_INTEGRATION_TOKEN: remote-integration-token

      - name: Drop isolated TypeScript remote live-smoke database
        if: ${{ always() }}
        shell: bash
        env:
          KITEFRAME_SMOKE_DATABASE_NAME: kiteframe_ci_typescript_remote_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python3 tests/ci/isolated_database.py drop \
            --database-url "$DATABASE_URL" \
            --database-name "$KITEFRAME_SMOKE_DATABASE_NAME"

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Test Python client
        run: uv run --project clients/python pytest -q clients/python/tests

      - name: Lint Python client
        run: uv run ruff check src tests scripts
        working-directory: clients/python

      - name: Type-check Python client
        working-directory: clients/python
        run: uv run pyright

  python-wheels:
    name: Python wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux glibc arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Linux glibc x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build platform wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          working-directory: clients/python

      - name: Inspect, install, import, and launch wheel
        shell: bash
        run: python scripts/inspect_wheel.py "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
        working-directory: clients/python

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
        working-directory: clients/typescript

  typescript-platform-packages:
    name: TypeScript platform package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            package: darwin-arm64
            binary: kiteframe-harness
          - name: macOS x86_64
            runner: macos-15-intel
            package: darwin-x64
            binary: kiteframe-harness
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            package: linux-arm64
            binary: kiteframe-harness
          - name: Linux x86_64
            runner: ubuntu-24.04
            package: linux-x64
            binary: kiteframe-harness
          - name: Windows x86_64
            runner: windows-latest
            package: win32-x64
            binary: kiteframe-harness.exe
    runs-on: ${{ matrix.runner }}
    env:
      KITEFRAME_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build harness and stage platform package
        shell: bash
        run: |
          cargo build --release --bin kiteframe-harness
          bun install --frozen-lockfile
          bun run package-platform -- "${{ matrix.package }}" "../../target/release/${{ matrix.binary }}"
          (cd "npm/${{ matrix.package }}" && bun pm pack)
          tar -tzf "npm/${{ matrix.package }}"/*.tgz | grep -F "package/${{ matrix.binary }}"
          KITEFRAME_BUN_SMOKE_DIR="$(mktemp -d)"
          bun init -y --cwd "$KITEFRAME_BUN_SMOKE_DIR"
          bun add --cwd "$KITEFRAME_BUN_SMOKE_DIR" "$(pwd)/npm/${{ matrix.package }}"/*.tgz
          "$KITEFRAME_BUN_SMOKE_DIR/node_modules/.bin/kiteframe-harness" --version
        working-directory: clients/typescript

      - name: Upload packed platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: kiteframe-${{ matrix.package }}
          path: clients/typescript/npm/${{ matrix.package }}/*.tgz

      - name: Test, type-check, and build TypeScript client
        run: |
          bun test
          bun run typecheck
          bun run build
        working-directory: clients/typescript
