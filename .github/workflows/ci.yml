name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wave-2:
    name: Wave 2 and 3R gates
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check fuzz workspace formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Test authenticated provider HTTP profile
        run: cargo test -p kiteframe-provider-http --test http_profile

      - name: Check server authority boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'ProviderAuthenticator|CatalogFetchResult' \
            crates/kiteframe-provider-http/src; then
            echo "client authentication or catalog-fetch authority leaked into the server" >&2
            exit 1
          fi

      - name: Check generated schemas
        run: cargo run -p kiteframe-schema -- --check schemas/v1alpha1

      - name: Check generated Python stubs
        run: >-
          cargo run -p kiteframe-schema --
          --check-python-stubs python/kiteframe/src/kiteframe/_native.pyi

      - name: Check portable dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          dependencies="$(cargo tree \
            -p kiteframe-contract \
            -p kiteframe-core \
            --edges normal \
            --prefix none)"
          forbidden='^(deepagents|langchain|langgraph|openfga|opentelemetry|opentelemetry_sdk|tracing-opentelemetry)( |$)'
          if grep -E "${forbidden}" <<<"${dependencies}"; then
            echo "portable crate depends on a runtime, authorization, or telemetry SDK" >&2
            exit 1
          fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Build Python native extension
        working-directory: python/kiteframe
        run: uv run --project . maturin develop

      - name: Test Python package
        working-directory: python/kiteframe
        run: uv run --project . pytest -q

      - name: Lint Python package
        working-directory: python/kiteframe
        run: uv run --project . ruff check src tests

      - name: Type-check Python package
        working-directory: python/kiteframe
        run: uv run --project . pyright

      - name: Run Wave 3R no-loss and consumer gates
        working-directory: python/kiteframe
        run: >-
          uv run --project . pytest -q
          tests/test_native_golden.py
          tests/test_service_round_trip.py
          tests/test_wave4_consumer_gate.py
          tests/test_wave5_consumer_gate.py
          tests/conformance/test_crankshaft_profile.py

  wave-4:
    name: Wave 4 Deep Agents adapter gate
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Build Python native extension
        working-directory: python/kiteframe
        run: uv run --project . maturin develop

      - name: Verify Wave 3R native contracts
        run: >-
          uv run --project python/kiteframe
          python scripts/verify_wave3r.py

      - name: Test Deep Agents adapter
        working-directory: python/kiteframe-deepagents
        run: uv run --project . pytest -q

      - name: Lint Deep Agents adapter
        working-directory: python/kiteframe-deepagents
        run: uv run --project . ruff check src tests

      - name: Type-check Deep Agents adapter
        working-directory: python/kiteframe-deepagents
        run: uv run --project . pyright

      - name: Check Deep Agents target metadata drift
        working-directory: python/kiteframe-deepagents
        run: >-
          uv run --project . python -m kiteframe_deepagents.target
          --check ../../runtime-targets/deepagents-0.6.12.json

  fuzz:
    name: Strict YAML invariant and fuzz gates
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install nightly Rust
        run: rustup toolchain install nightly-2026-07-25 --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Check deterministic strict YAML invariants
        run: bash fuzz/check-invariants.sh

      - name: Run stochastic strict YAML fuzz smoke
        run: cargo fuzz run strict_yaml -- -max_total_time=10

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-yaml-fuzz-artifacts
          path: fuzz/artifacts/strict_yaml
          if-no-files-found: ignore
