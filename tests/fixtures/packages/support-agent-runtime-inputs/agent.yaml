apiVersion: kiteframe.dev/v1alpha1
kind: Agent
metadata: { name: support-agent, version: 0.1.0 }
spec:
  prompt: { system: prompts/system.md }
  models:
    primary:
      capabilities: [text, tool-calling]
      minContextTokens: 1000
      maxLatencyClass: interactive
      residency: global
  capabilities:
    - { name: cases.read, version: ^1.0, required: true, resources: [tenant:support] }
  observability:
    contentCapture: { allowed: true, classifications: [confidential] }
