[package]
name = "kiteframe-provider-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kiteframe-provider"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
clap.workspace = true
http-body = "1"
kiteframe-contract = { path = "../kiteframe-contract" }
kiteframe-provider = { path = "../kiteframe-provider" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["limit"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
kiteframe-audit = { path = "../kiteframe-audit" }
kiteframe-provider-sqlite = { path = "../kiteframe-provider-sqlite" }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
