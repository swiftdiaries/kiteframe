[package]
name = "kiteframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
default-run = "kiteframe-harness"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kiteframe-harness"
path = "src/main.rs"

[features]
default = []
acp-v2 = []

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
