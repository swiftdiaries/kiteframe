[workspace]
resolver = "3"
members = [
    "crates/kiteframe-contract",
    "crates/kiteframe-core",
    "crates/kiteframe-resolver",
    "crates/kiteframe-schema",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/swiftdiaries/kiteframe"

[workspace.dependencies]
jsonschema = { version = "0.40", default-features = false }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
yaml-rust2 = "0.10"
