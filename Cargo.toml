[workspace]
resolver = "3"
members = ["crates/kiteframe-contract", "crates/kiteframe-schema"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/swiftdiaries/kiteframe"

[workspace.dependencies]
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
