[package]
name = "kiteframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
default-run = "kiteframe-harness"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kiteframe-harness"
path = "src/main.rs"

[features]
default = []
acp-v2 = ["agent-client-protocol/unstable_protocol_v2"]
test-support = []

[dependencies]
agent-client-protocol = "=2.0.0"
agent-client-protocol-http = { version = "=2.0.0", features = ["client", "server"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
cedar-policy = "=4.11.0"
cedar-policy-mcp-schema-generator = { version = "=0.6.0", features = ["serde", "serde_json"] }
futures = "0.3"
http = "1"
mcp-tools-sdk = "=0.4.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
thiserror = "2"
subtle = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
async-tungstenite = { version = "0.34", features = ["tokio-runtime"] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
