[package]
name = "kiteframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
default-run = "kiteframe-harness"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kiteframe-harness"
